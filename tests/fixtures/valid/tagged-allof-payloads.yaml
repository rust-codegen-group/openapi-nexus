openapi: 3.1.0
info:
  title: Tagged allOf payload preservation
  version: 1.0.0
paths:
  /tools:
    post:
      operationId: exchange_tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Envelope'
      responses:
        '200':
          description: Preserved tool declarations and search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
components:
  schemas:
    Options:
      type: object
      properties:
        allowed_callers:
          type: array
          items: {type: string}
        defer_loading: {type: boolean}
        output_schema:
          type: object
          additionalProperties: true
    ExtraFields:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string}
    OptionalName:
      type: object
      properties:
        name: {type: string}
    FirstConfig:
      type: object
      required: [config]
      properties:
        config:
          type: object
          required: [first_name]
          properties:
            first_name: {type: string}
    SecondConfig:
      type: object
      required: [config]
      properties:
        config:
          type: object
          required: [last_name]
          properties:
            last_name: {type: string}
    Tool:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [name, parameters]
              properties:
                name:
                  type: string
                  description: Authored function name
                  minLength: 1
                description: {type: string}
                parameters:
                  type: object
                  additionalProperties: true
                strict: {type: boolean}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [function]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [name, tools]
              properties:
                name: {type: string}
                description: {type: string}
                tools:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tool'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [namespace]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [environment]
              properties:
                environment:
                  $ref: '#/components/schemas/Environment'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [shell]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [type, input_schema]
              properties:
                type: {type: string, enum: [custom]}
                input_schema:
                  type: object
                  additionalProperties: true
        - allOf:
            - type: object
              required: [inline_name]
              properties:
                inline_name: {type: string}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [inline_only]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - $ref: '#/components/schemas/ExtraFields'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [multiple_refs]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [outer_properties]}
          type: object
          required: [outer_name]
          properties:
            outer_name: {type: string}
            outer_flag: {type: boolean}
            outer_count: {type: integer}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [simple]}
        - allOf:
            - $ref: '#/components/schemas/OptionalName'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [outer_required]}
          required: [name]
        - allOf:
            - $ref: '#/components/schemas/FirstConfig'
            - $ref: '#/components/schemas/SecondConfig'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [overlap]}
        - allOf:
            - $ref: '#/components/schemas/Options'
            - allOf:
                - type: object
                  properties:
                    inner_name: {type: string}
              type: object
              required: [outer_name]
              properties:
                outer_name: {type: string}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [nested_fields]}
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [other]}
    Environment:
      type: object
      required: [type, working_directory, skills]
      properties:
        type: {type: string, enum: [local]}
        working_directory: {type: string}
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
    Skill:
      type: object
      required: [skill_path]
      properties:
        skill_path: {type: string}
    SearchOutput:
      type: object
      required: [type, call_id, tools]
      properties:
        type: {type: string, enum: [tool_search_output]}
        call_id: {type: string}
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    InputItem:
      oneOf:
        - $ref: '#/components/schemas/SearchOutput'
        - type: string
    Input:
      oneOf:
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/InputItem'
    Envelope:
      type: object
      required: [tools, input]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        input:
          $ref: '#/components/schemas/Input'
