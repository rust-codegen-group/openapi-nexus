openapi: 3.1.0
info:
  title: Tagged allOf payload preservation
  version: 1.0.0
paths:
  /variants:
    post:
      operationId: exchange_variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Container'
      responses:
        '200':
          description: Preserved variant declarations and result payloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Container'
components:
  schemas:
    SharedFields:
      type: object
      properties:
        allowed_sources:
          type: array
          items: {type: string}
        deferred: {type: boolean}
        output_shape:
          type: object
          additionalProperties: true
    ExtraFields:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string}
    OptionalLabel:
      type: object
      properties:
        label: {type: string}
    FirstShape:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [first_value]
          properties:
            first_value: {type: string}
    SecondShape:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [second_value]
          properties:
            second_value: {type: string}
    Variant:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [label, arguments]
              properties:
                label:
                  type: string
                  description: Variant label
                  minLength: 1
                details: {type: string}
                arguments:
                  type: object
                  additionalProperties: true
                strict_mode: {type: boolean}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_a]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [label, members]
              properties:
                label: {type: string}
                details: {type: string}
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/Variant'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_b]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [configuration]
              properties:
                configuration:
                  $ref: '#/components/schemas/NestedConfig'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_c]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [type, input_shape]
              properties:
                type: {type: string, enum: [variant_d]}
                input_shape:
                  type: object
                  additionalProperties: true
        - allOf:
            - type: object
              required: [inline_label]
              properties:
                inline_label: {type: string}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_e]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - $ref: '#/components/schemas/ExtraFields'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_f]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_g]}
          type: object
          required: [outer_label]
          properties:
            outer_label: {type: string}
            outer_flag: {type: boolean}
            outer_count: {type: integer}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_h]}
        - allOf:
            - $ref: '#/components/schemas/OptionalLabel'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_i]}
          required: [label]
        - allOf:
            - $ref: '#/components/schemas/FirstShape'
            - $ref: '#/components/schemas/SecondShape'
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_j]}
        - allOf:
            - $ref: '#/components/schemas/SharedFields'
            - allOf:
                - type: object
                  properties:
                    inner_label: {type: string}
              type: object
              required: [outer_label]
              properties:
                outer_label: {type: string}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [variant_k]}
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [variant_l]}
    NestedConfig:
      type: object
      required: [type, location, entries]
      properties:
        type: {type: string, enum: [nested]}
        location: {type: string}
        entries:
          type: array
          items:
            $ref: '#/components/schemas/NestedEntry'
    NestedEntry:
      type: object
      required: [entry_path]
      properties:
        entry_path: {type: string}
    ResultItem:
      type: object
      required: [type, request_id, members]
      properties:
        type: {type: string, enum: [result]}
        request_id: {type: string}
        members:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    ContainerItem:
      oneOf:
        - $ref: '#/components/schemas/ResultItem'
        - type: string
    ContainerInput:
      oneOf:
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/ContainerItem'
    Container:
      type: object
      required: [members, input]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        input:
          $ref: '#/components/schemas/ContainerInput'
