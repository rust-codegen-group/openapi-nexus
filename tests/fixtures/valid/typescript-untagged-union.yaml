openapi: 3.1.0
info:
  title: Untagged union conversion
  version: 1.0.0
paths: {}
components:
  schemas:
    ClientTool:
      type: object
      required: [name, input_schema]
      properties:
        name:
          type: string
        input_schema:
          type: object
          additionalProperties: true
    SearchTool:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [web_search_20250305]
        name:
          type: string
          enum: [web_search]
        max_uses:
          type: integer
    Tool:
      oneOf:
        - $ref: '#/components/schemas/ClientTool'
        - $ref: '#/components/schemas/SearchTool'
    NullableTool:
      anyOf:
        - $ref: '#/components/schemas/Tool'
        - type: 'null'
    ToolAlias:
      allOf:
        - $ref: '#/components/schemas/Tool'
    ToolList:
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/ClientTool'
        - type: array
          items:
            $ref: '#/components/schemas/SearchTool'
    ToolMap:
      oneOf:
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/ClientTool'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/SearchTool'
    OpenTool:
      anyOf:
        - {}
        - $ref: '#/components/schemas/ClientTool'
    AlternativeTool:
      type: object
      required: [name, input_schema]
      properties:
        name:
          type: string
        input_schema:
          type: object
          additionalProperties: true
        second_option:
          type: boolean
    AmbiguousTool:
      anyOf:
        - $ref: '#/components/schemas/ClientTool'
        - $ref: '#/components/schemas/AlternativeTool'
    ToolRequest:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
