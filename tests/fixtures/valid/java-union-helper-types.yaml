openapi: 3.1.0
info: {title: Java union helper types, version: 1.0.0}
paths: {}
components:
  schemas:
    Boolean: {type: object, properties: {}}
    Integer: {type: object, properties: {}}
    Long: {type: object, properties: {}}
    Float: {type: object, properties: {}}
    Double: {type: object, properties: {}}
    IntegerChoice:
      anyOf:
        - {type: integer}
        - {type: string}
    LongChoice:
      anyOf:
        - {type: integer, format: int64}
        - {type: string}
    FloatChoice:
      anyOf:
        - {type: number, format: float}
        - {type: string}
    DoubleChoice:
      anyOf:
        - {type: number}
        - {type: string}
    PrimitiveContainers:
      anyOf:
        - {type: array, items: {type: integer}}
        - {type: object, additionalProperties: {type: integer}}
        - {type: string}
    NestedBooleans:
      anyOf:
        - type: array
          items: {type: object, additionalProperties: {type: boolean}}
        - {type: string}
    NamedIntegerChoice:
      anyOf:
        - {$ref: '#/components/schemas/Integer'}
        - {type: string}
    NamedIntegerListChoice:
      anyOf:
        - {type: array, items: {$ref: '#/components/schemas/Integer'}}
        - {type: string}
    Branch:
      type: object
      required: [children]
      properties:
        children: {type: array, items: {$ref: '#/components/schemas/Tree'}}
    Tree:
      anyOf:
        - {$ref: '#/components/schemas/Branch'}
        - {type: string}
