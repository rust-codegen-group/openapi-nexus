openapi: 3.1.0
info: {title: Optional and multi-valued tool tags, version: 1.0.0}
paths: {}
components:
  schemas:
    ClientTool:
      type: object
      required: [name, input_schema]
      properties:
        name: {type: string}
        input_schema: {type: object, additionalProperties: true}
    SearchType:
      type: string
      enum: [web_search_20250305, web_search_20260209]
    SearchTool:
      type: object
      required: [type, name]
      properties:
        type: {$ref: '#/components/schemas/SearchType'}
        name: {type: string, enum: [web_search]}
        max_uses: {type: integer}
    Tool:
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/ClientTool'}
            - type: object
              properties:
                type: {type: string, enum: [custom]}
        - {$ref: '#/components/schemas/SearchTool'}
