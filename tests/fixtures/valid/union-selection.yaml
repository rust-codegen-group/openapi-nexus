openapi: 3.1.0
info: {title: Union selection contract, version: 1.0.0}
paths: {}
components:
  schemas:
    PayloadA:
      type: object
      required: [label, payload_schema]
      properties:
        label: {type: string}
        payload_schema: {type: object, additionalProperties: true}
    PayloadB:
      type: object
      required: [kind, label]
      properties:
        kind: {type: string, enum: [variant_b]}
        label: {type: string, enum: [payload_b]}
        limit: {type: integer}
    VariantSet:
      oneOf:
        - {$ref: '#/components/schemas/PayloadA'}
        - {$ref: '#/components/schemas/PayloadB'}
    VariantRequest:
      type: object
      required: [choices]
      properties:
        choices: {type: array, items: {$ref: '#/components/schemas/VariantSet'}}
    NumericOne:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, enum: [1]}
        first_value: {type: string}
    NumericTwo:
      type: object
      required: [revision]
      properties:
        revision: {type: integer, enum: [2]}
        second_value: {type: string}
    Choice:
      oneOf:
        - {$ref: '#/components/schemas/NumericOne'}
        - {$ref: '#/components/schemas/NumericTwo'}
    RequiredOne:
      type: object
      required: [revision, first_value]
      properties:
        revision: {type: integer, enum: [1]}
        first_value: {type: string}
    RequiredTwo:
      type: object
      required: [revision, second_value]
      properties:
        revision: {type: integer, enum: [2]}
        second_value: {type: string}
    RequiredChoice:
      oneOf:
        - {$ref: '#/components/schemas/RequiredOne'}
        - {$ref: '#/components/schemas/RequiredTwo'}
    Envelope:
      type: object
      required: [choice, choice_list, choice_map]
      properties:
        choice: {$ref: '#/components/schemas/Choice'}
        choice_list: {type: array, items: {$ref: '#/components/schemas/Choice'}}
        choice_map: {type: object, additionalProperties: {$ref: '#/components/schemas/Choice'}}
