openapi: 3.1.0
info: {title: Python additional properties, version: '1.0.0'}
paths:
  /mixed:
    post:
      operationId: echoMixed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MixedMap'}
      responses:
        '200':
          description: Mixed object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MixedMap'}
        '400':
          description: Typed dictionary error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TypedMap'}
  /dictionary:
    post:
      operationId: echoDictionary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DictionaryAlias'}
      responses:
        '200':
          description: Typed dictionary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DictionaryAlias'}
components:
  schemas:
    NestedValue:
      type: object
      required: [wire_value]
      properties:
        wire_value: {type: string}
    OpaqueMap:
      type: object
      required: [known_field]
      properties:
        known_field: {type: string}
      additionalProperties: true
    MixedMap:
      type: object
      required: [known_field]
      properties:
        known_field: {type: string}
      additionalProperties: {$ref: '#/components/schemas/NestedValue'}
    TypedMap:
      type: object
      additionalProperties: {$ref: '#/components/schemas/NestedValue'}
    RawMap:
      type: object
      additionalProperties: {}
    Any:
      type: object
      additionalProperties: true
    Numbers:
      type: object
      additionalProperties: {type: integer, format: int64}
    Status:
      type: string
      enum: [active, inactive]
    StatusValues:
      type: object
      additionalProperties: {$ref: '#/components/schemas/Status'}
    NullableValues:
      type: object
      additionalProperties:
        anyOf: [{$ref: '#/components/schemas/NestedValue'}, {type: 'null'}]
    DeepValues:
      type: object
      additionalProperties:
        type: array
        items:
          type: object
          additionalProperties: {$ref: '#/components/schemas/NestedValue'}
    DictionaryAlias: {$ref: '#/components/schemas/TypedMap'}
    ValueAlias: {$ref: '#/components/schemas/NestedValue'}
    AliasValues:
      type: object
      additionalProperties: {$ref: '#/components/schemas/ValueAlias'}
    Choices:
      type: object
      additionalProperties: {$ref: '#/components/schemas/ValueChoice'}
    ValueChoice:
      anyOf: [{$ref: '#/components/schemas/NestedValue'}, {type: integer}]
    AmbiguousValues:
      type: object
      additionalProperties: {$ref: '#/components/schemas/AmbiguousNumber'}
    AmbiguousNumber:
      anyOf: [{type: integer}, {type: number}]
    DictionaryChoice:
      anyOf: [{$ref: '#/components/schemas/TypedMap'}, {type: integer}]
    MixedChoice:
      anyOf: [{$ref: '#/components/schemas/MixedMap'}, {type: string}]
    Event:
      oneOf:
        - type: object
          required: [type, sequence_number]
          properties:
            type: {type: string, enum: [searching]}
            sequence_number: {type: integer}
          additionalProperties: true
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [completed]}
          additionalProperties: true
    EventValues:
      type: object
      additionalProperties: {$ref: '#/components/schemas/Event'}
    Recursive:
      type: object
      required: [wire_value]
      properties:
        wire_value: {type: string}
      additionalProperties: {$ref: '#/components/schemas/Recursive'}
    PureRecursive:
      type: object
      additionalProperties: {$ref: '#/components/schemas/PureRecursive'}
    Node:
      type: object
      required: [wire_value, children]
      properties:
        wire_value: {type: string}
        children: {$ref: '#/components/schemas/Nodes'}
    Nodes:
      type: object
      additionalProperties: {$ref: '#/components/schemas/Node'}
    StorageCollision:
      type: object
      required: [additionalProperties]
      properties:
        additionalProperties: {type: string}
      additionalProperties: {$ref: '#/components/schemas/NestedValue'}
    FactoryCollision:
      type: object
      properties:
        field: {type: string}
        dict: {type: string}
      additionalProperties: true
    OptionalKnown:
      type: object
      properties:
        known_field: {type: string}
      additionalProperties: true
    OptionalHolder:
      type: object
      required: [nullable]
      properties:
        maybe: {$ref: '#/components/schemas/MixedMap'}
        nullable:
          anyOf: [{$ref: '#/components/schemas/MixedMap'}, {type: 'null'}]
    LegacyOptionalHolder:
      type: object
      required: [nullable]
      properties:
        maybe: {$ref: '#/components/schemas/NestedValue'}
        nullable:
          anyOf: [{$ref: '#/components/schemas/NestedValue'}, {type: 'null'}]
    Closed:
      type: object
      properties:
        known_field: {type: string}
      additionalProperties: false
    Implicit:
      type: object
      properties:
        known_field: {type: string}
    Holder:
      type: object
      required: [mixed, opaque, dictionaries, aliases]
      properties:
        mixed: {$ref: '#/components/schemas/MixedMap'}
        opaque: {$ref: '#/components/schemas/OpaqueMap'}
        dictionaries: {type: array, items: {$ref: '#/components/schemas/TypedMap'}}
        aliases: {type: object, additionalProperties: {$ref: '#/components/schemas/DictionaryAlias'}}
