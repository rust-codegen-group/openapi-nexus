openapi: 3.1.0
info: {title: Whole and finite tagged values, version: '1'}
paths: {}
components:
  schemas:
    LegacyText:
      type: string
    Items:
      type: array
      items: {$ref: '#/components/schemas/Item'}
    Item:
      type: object
      required: [item_value]
      properties:
        item_value: {type: string}
    Choice:
      oneOf:
        - allOf:
            - type: object
              required: [body_value]
              properties:
                kind_key: {type: string, enum: [record, record_alt]}
                body_value: {type: string}
        - $ref: '#/components/schemas/LegacyText'
        - $ref: '#/components/schemas/Items'
    MixedPayload:
      anyOf:
        - type: string
        - $ref: '#/components/schemas/Item'
    MixedChoice:
      oneOf:
        - allOf:
            - type: object
              required: [body_value]
              properties:
                kind_key: {type: string, enum: [entry, entry_alt]}
                body_value: {type: string}
        - $ref: '#/components/schemas/MixedPayload'
    FiniteChoice:
      oneOf:
        - allOf:
            - type: object
              required: [marker_value, marker_list]
              properties:
                kind_key: {type: string, enum: [finite, finite_alt]}
                marker_value: {const: {leaf_key: [1, true]}}
                marker_list: {const: [null, {literal_key: false}]}
        - allOf:
            - type: object
              required: [kind_key, label]
              properties:
                kind_key: {type: string, enum: [other]}
                label: {type: string}
    Marker:
      type: object
      required: [leaf_value]
      properties:
        leaf_value: {type: boolean}
        note_value: {type: string}
    TypedChoice:
      type: object
      required: [marker]
      properties:
        marker: {const: {leaf_value: true}}
      oneOf:
        - allOf:
            - type: object
              required: [marker, item_value]
              properties:
                kind_key: {type: string, enum: [known, known_alt]}
                marker: {$ref: '#/components/schemas/Marker'}
                item_value: {type: string}
        - allOf:
            - type: object
              required: [marker, body_value]
              properties:
                kind_key: {type: string, enum: [away]}
                marker: {$ref: '#/components/schemas/Marker'}
                body_value: {type: string}
    Declared:
      type: object
      required: [guard_value, snake_key]
      properties:
        guard_value: {type: boolean}
        snake_key: {type: string}
    Entries:
      type: object
      additionalProperties: {type: string}
    MarkerUnion:
      anyOf:
        - $ref: '#/components/schemas/Declared'
        - $ref: '#/components/schemas/Entries'
    UnionChoice:
      type: object
      required: [marker]
      properties:
        marker:
          enum:
            - {snake_key: b}
            - {guard_value: true, snake_key: a}
      oneOf:
        - allOf:
            - type: object
              required: [marker, item_value]
              properties:
                kind_key: {type: string, enum: [alias, alias_alt]}
                marker: {$ref: '#/components/schemas/MarkerUnion'}
                item_value: {type: string}
        - allOf:
            - type: object
              required: [marker, body_value]
              properties:
                kind_key: {type: string, enum: [exit]}
                marker: {$ref: '#/components/schemas/MarkerUnion'}
                body_value: {type: string}
