[package]
name = "aioduct-client-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dev-dependencies]
typed-error-responses-api = { path = "generated/typed-error-responses" }
rust-error-payload-shapes-api = { path = "generated/rust-error-payload-shapes" }
nested-nullable-api = { path = "generated/nested-nullable" }
union-selection-contract = { path = "generated/union-selection" }
rust-union-first-match = { path = "generated/union-first-match" }
rust-union-strict = { path = "generated/union-strict" }
rust-union-raw = { path = "generated/union-raw" }
utoipa = "5"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
aioduct = { version = "0.2", features = ["tokio", "rustls", "rustls-ring", "json"] }
